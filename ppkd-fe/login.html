<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-6">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h3>Login Form</h3>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="Masukkan email"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="">Password</label>
                                <input type="password" id="password" class="form-control"
                                    placeholder="Masukkan password" required>
                            </div>
                            <div class="mb-3">
                                <button class="btn btn-primary" type="submit">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const baseURL = "http://localhost:8000/api/";

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Mematikan aksi default button

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(baseURL + "login", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ email, password })
                });
                // Jika status 422 / Validation Fail
                console.log(res);
                if (res.status == 422) {
                    const errorsData = await res.json();
                    let messageError = [];
                    for (const index in errorsData.errors) {
                        messageError.push(errorsData.errors[index][0])
                    }
                    Swal.fire({
                        icon: 'warning',
                        title: "Validasi Gagal",
                        text: messageError.join("<br>")
                    });
                    return
                }
                // login salah
                if (!res.ok) {
                    const errors = await res.json();
                    Swal.fire({
                        icon: 'warning',
                        title: 'Login Gagal',
                        text: errors.message
                    })
                    return
                }

                const data = await res.json();
                // localStorage.getItem('token') : mengambil nilai token
                localStorage.setItem('token', data.token);
                Swal.fire({
                    icon: 'success',
                    title: 'Login Berhasil',
                    text: "Selamat datang, " + data.user.name ?? "Guest",
                    confirmButtonText: 'Ok'
                }).then(function () {
                    window.location.href = "user.html"
                });
            } catch (error) {
                console.log("error: ", error)
                Swal.fire({
                    icon: 'error',
                    title: 'Terjadi Kesalahan',
                    text: error.message
                })
            }
        })
        function resetForm() {
            document.getElementById('name').value = "";
            document.getElementById('email').value = "";
            document.getElementById('password').value = "";
        }
    </script>
</body>

</html>
